  - title: "The Road to Revolution"
    description: "Joseph Warren, the Continental Congresses, and the nomination of Washington, 1774–1775"
    body: |
      In the years after the Massacre, Adams moved from cautious reformer to committed
      revolutionary. He drew close to the radical Boston circle — his cousin Samuel Adams, John
      Hancock, and especially Dr. Joseph Warren, a charismatic physician and orator whose energy
      Adams deeply admired. When Massachusetts sent delegates to the Continental Congress, Adams
      went to Philadelphia and became one of the boldest voices for resistance and, before long,
      for independence. It was Adams who nominated George Washington to command the new
      Continental Army — a stroke of political genius that bound the southern colonies to a
      war that had begun in New England.
    links:
      - title: "First Continental Congress — U.S. House History"
        url: "https://history.house.gov/Institution/Origins-Development/Continental-Congress/"
      - title: "Joseph Warren — Massachusetts Historical Society"
