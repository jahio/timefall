            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 3"
      - title: "Battle of Bunker Hill and the Death of Joseph Warren"
        date: "1775-06-17"
        description: "A costly British victory; Adams's friend Joseph Warren is killed"
        body: |
          At the Battle of Bunker Hill (fought largely on Breed's Hill) on June 17, 1775, colonial
          militia inflicted staggering casualties on the attacking British before running out of
          powder and withdrawing. Among the American dead was Dr. Joseph Warren, who had declined
          to exercise the command his new general's commission gave him and instead fought and
          died as an ordinary volunteer in the redoubt. His death shocked the colonies and made
          him an instant martyr. For Adams, the loss of so gifted and selfless a friend sharpened
          both his grief and his resolve, a personal wound bound up with the cause itself.
        links:
          - title: "Battle of Bunker Hill — Boston National Historical Park (NPS)"
            url: "https://www.nps.gov/bost/learn/historyculture/bhm.htm"
        citations:
