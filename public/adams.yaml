    actions:
      - title: "John Quincy Adams Becomes President"
        date: "1825-03-04"
        description: "Adams sees his son inaugurated as the sixth President of the United States"
        body: |
          After a contested election decided in the House of Representatives, John Quincy Adams
          was inaugurated as the sixth President on March 4, 1825. The elder Adams, nearing ninety
          and frail, took immense pride in the achievement — the only time in American history
          that a President's son would follow him into the office during the father's lifetime.
        links:
