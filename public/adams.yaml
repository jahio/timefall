      - title: "Appointed Commissioner to France"
        date: "1777-11-28"
        description: "Congress names Adams to replace Silas Deane on the French commission"
        body: |
          In late November 1777, Congress appointed Adams a joint commissioner to France,
          replacing the recalled Silas Deane and joining Benjamin Franklin and Arthur Lee. Adams
          accepted despite the dangers of a winter Atlantic crossing in wartime, and despite the
          wrench of leaving Abigail and most of the children behind.
        links:
          - title: "Founders Online — National Archives"
            url: "https://founders.archives.gov/"
