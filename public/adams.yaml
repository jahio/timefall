      - title: "Rex v. Preston — Trial of Captain Thomas Preston"
        date: "1770-10-24"
        description: "Preston is tried first; the jury cannot find that he ordered his men to fire"
        body: |
          Captain Preston was tried separately and first, in late October 1770. The central
          question was whether he had given the order to fire. Adams and his co-counsel argued
          that the evidence was contradictory and could not prove he had. The jury agreed, and
          Preston was acquitted at the end of October. The verdict set the stage for the harder
          case: that of the soldiers themselves, who had unquestionably pulled the triggers.
        links:
          - title: "Rex v. Preston — Famous Trials"
            url: "https://famous-trials.com/bostonmassacre/218-preston"
