            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 7"
      - title: "Returns Home to the United States"
        date: "1788-06-17"
        description: "Adams comes home as the new federal Constitution is being ratified"
        body: |
          Adams and Abigail returned to Massachusetts in the summer of 1788, just as the new
          federal Constitution was winning ratification. He came home a figure of national
          stature — one of the acknowledged founders — and immediately became a candidate for
          high office under the government now taking shape.
        links:
          - title: "Adams Papers — Massachusetts Historical Society"
            url: "https://www.masshist.org/adams"
