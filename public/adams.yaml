    actions:
      - title: "The Committee of Five is Appointed"
        date: "1776-06-11"
        description: "Adams, Jefferson, Franklin, Sherman, and Livingston are chosen to draft a declaration"
        body: |
          On June 11, 1776, Congress appointed a committee of five — John Adams, Thomas Jefferson,
          Benjamin Franklin, Roger Sherman, and Robert R. Livingston — to prepare a declaration of
          independence. Adams pressed Jefferson to write the draft, later explaining that
          Jefferson could write ten times better than he could and that Adams himself was too
          "obnoxious, suspected, and unpopular" to be its face. It was a shrewd act of political
          self-awareness.
        links:
          - title: "Drafting the Declaration — National Archives"
            url: "https://www.archives.gov/founding-docs/declaration-history"
        citations:
          - author: Pauline Maier
            source_title: "American Scripture: Making the Declaration of Independence"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Alfred A. Knopf
            publication_date: 1997
            source_location:
      - title: "Congress Votes for Independence"
        date: "1776-07-02"
        description: "The Lee Resolution passes; the colonies declare themselves free states"
        body: |
          On July 2, 1776, Congress adopted Richard Henry Lee's resolution declaring the colonies
          "free and independent States." Adams believed this was the truly historic day. In a
          jubilant letter to Abigail he predicted that the "Second Day of July 1776" would be
          celebrated by later generations with pomp, parades, illuminations, and fireworks. He was
          right about the celebration and off by two days about the date, for it was the adoption
          of Jefferson's declaration on July 4 that fixed itself in national memory.
        links:
          - title: "John Adams to Abigail Adams, July 3, 1776 — MHS"
            url: "https://www.masshist.org/digitaladams/"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 3"
      - title: "The Declaration of Independence is Adopted"
        date: "1776-07-04"
        description: "Congress approves the final text of the Declaration"
        body: |
          On July 4, 1776, Congress approved the final wording of the Declaration of Independence.
          Adams had led its defense on the floor through two days of debate and amendment. Though
          he thought the second of July the more important date, it was the fourth that the
          nation would come to commemorate — and, half a century later, the day on which both
          Adams and Jefferson would die.
        links:
          - title: "The Declaration of Independence — National Archives"
            url: "https://www.archives.gov/founding-docs/declaration-transcript"
