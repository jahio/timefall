    actions:
      - title: "John Quincy Adams's Antislavery Crusade in Congress"
        date: "1831-12-05"
        description: "The former president returns to public life as an antislavery congressman"
        body: |
          In a remarkable second act unmatched in American politics, John Quincy Adams — having
          lost the presidency in 1828 — was elected to the House of Representatives, where he
          served for seventeen years. He became the fiercest congressional opponent of the "gag
          rule" that suppressed antislavery petitions, and in 1841 argued successfully before the
          Supreme Court for the freedom of the enslaved Africans of the ship Amistad. The elder
          Adams did not live to see it, but his son carried the family's moral seriousness into
          the fight against slavery.
        links:
          - title: "John Quincy Adams and the Amistad — National Archives"
            url: "https://www.archives.gov/"
