      - title: "Birth of John Quincy Adams"
        date: "1767-07-11"
        description: "The Adamses' first son, a future sixth president, is born"
        body: |
          John Quincy Adams was born on July 11, 1767, the eldest son of John and Abigail. As a
          boy he accompanied his father on diplomatic missions to Europe, witnessed the Battle of
          Bunker Hill from a hilltop with his mother, and grew into one of the most accomplished
          public men of his generation — diplomat, senator, secretary of state, sixth President
          of the United States, and, in his final chapter, an antislavery congressman. He was
          the great vindication of his father's belief in disciplined education.
        links:
