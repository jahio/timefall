      - title: "Death of John Adams"
        date: "1826-07-04"
        time: "18:20:00 EDT" # late afternoon; time approximate
        description: "Adams dies on the fiftieth anniversary of independence, hours after Jefferson"
        body: |
          John Adams died at Peacefield on the afternoon of July 4, 1826 — the fiftieth
          anniversary of the Declaration of Independence he had done so much to bring about. His
          reported last words were "Thomas Jefferson survives," not knowing that Jefferson had
          died at Monticello a few hours earlier that same day. The double death on so symbolic a
          date was received across the country as a sign of divine favor on the American
          experiment, and it fixed the two rivals forever together in national memory.
        links:
          - title: "The Deaths of Adams and Jefferson — Monticello"
            url: "https://www.monticello.org/"
