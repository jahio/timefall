  - title: "Legacy After His Death"
    description: "The long afterlife of John Adams's ideas, family, and reputation"
    body: |
      Adams's influence outlived him in three great channels: the constitutional ideas he helped
      pioneer, the extraordinary family and body of papers he left behind, and the slow rise and
      fall and rise again of his historical reputation. Overshadowed for generations by Jefferson,
      Washington, and Franklin, he was rediscovered in the late twentieth and early
      twenty-first centuries as one of the most humanly compelling and intellectually serious of
      the founders.
    links:
      - title: "Adams National Historical Park — National Park Service"
        url: "https://www.nps.gov/adam/index.htm"
