  - title: "The Boston Massacre Trials"
    description: "Adams defends the accused British soldiers, 1770"
    body: |
      When British soldiers fired into a Boston crowd on the night of March 5, 1770, killing five
      colonists, popular fury demanded convictions. Adams — already known as a critic of British
      policy — nonetheless agreed to defend the soldiers, believing that the right to counsel and
      a fair trial were the very principles the colonists claimed to be fighting for. It was a
      professionally and personally risky choice. He later called it "one of the best pieces of
      service I ever rendered my country." The soldiers were tried in two separate proceedings:
      first their commanding officer, Captain Thomas Preston, and then the enlisted men.
    links:
      - title: "Boston Massacre Trials — Famous Trials"
        url: "https://famous-trials.com/bostonmassacre"
      - title: "The Boston Massacre — Boston National Historical Park (NPS)"
