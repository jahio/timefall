      - title: "A Revival of Reputation"
        date: "2001-05-22"
        description: "McCullough's biography returns Adams to the center of the American story"
        body: |
          Long ranked below the more glamorous founders, Adams was returned to public affection by
          a wave of scholarship and popular history around the turn of the twenty-first century,
          most visibly David McCullough's best-selling 2001 biography and the acclaimed HBO
          miniseries it inspired. Adams — prickly, principled, deeply human — came to be seen not
          as a lesser founder but as one of the most honest and prescient of them, the man who
          argued for independence, insisted on the rule of law even for his enemies, built a navy,
          and chose an unpopular peace over a popular war.
        links:
          - title: "John Adams — Miller Center, University of Virginia"
            url: "https://millercenter.org/president/adams/impact-and-legacy"
