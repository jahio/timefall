      - title: "The Adams Papers Are Opened to Scholars"
        date: "1956-01-01"
        time: # the microfilm and edition project unfolded over years; a representative date
        description: "The family's vast archive is made available, transforming study of the founding"
        body: |
          The Adams family preserved an enormous archive of letters, diaries, and papers spanning
          generations. In the mid-twentieth century the Massachusetts Historical Society began the
          monumental Adams Papers editing project, opening the collection to scholars and the
          public. The letters of John and Abigail in particular — candid, affectionate, and
          politically astute — became foundational sources for understanding the Revolution and
          helped drive a major revival of interest in Adams himself.
        links:
          - title: "The Adams Papers — Massachusetts Historical Society"
            url: "https://www.masshist.org/adams"
