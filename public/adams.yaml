  - title: "Marriage and Family"
    description: "Abigail Smith and the birth of a future president, 1764–1767"
    body: |
      Adams's marriage to Abigail Smith was the central partnership of his life. She was
      intelligent, formidably well-read despite having no formal schooling, and unafraid to
      argue with him. Across decades of separation forced by his public service, their
      correspondence became one of the great records of the Revolutionary era — a running
      conversation about politics, farming, money, child-rearing, and the rights of women, whom
      Abigail famously urged him to "remember."
    links:
