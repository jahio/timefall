            source_location:

  - title: "Mission to the Dutch Republic"
    description: "Adams wins recognition and desperately needed loans from the Netherlands, 1780–1782"
    body: |
      Sent back to Europe in 1779 with a commission to negotiate peace and commerce with Britain,
      Adams found that assignment premature and turned his energy to the Netherlands. Working
      almost alone, without formal standing at first, he lobbied Dutch bankers and officials for
      recognition of the United States and for loans to keep the war and the fragile American
      economy afloat. It was slow, grinding, isolating work — and it succeeded, becoming perhaps
      his greatest diplomatic triumph.
    links:
      - title: "John Adams in the Netherlands — Founders Online"
        url: "https://founders.archives.gov/"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: Simon & Schuster
        publication_date: 2001
        source_location: "Chapter 6"
    actions:
      - title: "Sails Again for Europe"
        date: "1779-11-15"
        description: "Adams departs with a commission to negotiate with Britain, John Quincy again in tow"
        body: |
          In November 1779 Adams sailed once more for Europe, this time commissioned to negotiate
          eventual peace and commercial treaties with Great Britain. With Britain unwilling to
          talk and the French foreign minister Vergennes resentful of Adams's independence, Adams
          soon shifted his focus to the Dutch, where he believed real help could be found.
        links:
          - title: "Founders Online — National Archives"
            url: "https://founders.archives.gov/"
        citations:
          - author: John Ferling
            source_title: "John Adams: A Life"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Oxford University Press
            publication_date: 1992
            source_location:
      - title: "The Dutch Republic Recognizes the United States"
        date: "1782-04-19"
        description: "The Netherlands recognizes American independence; Adams becomes minister"
        body: |
          On April 19, 1782 — seven years to the day after Lexington and Concord — the Dutch
          Republic formally recognized the independence of the United States, and Adams was
          received as minister. He had, largely single-handed, made the Netherlands the second
          European power to acknowledge the new nation. He proudly called the house he acquired in
          The Hague the first American-owned embassy on foreign soil.
        links:
          - title: "Dutch-American Relations — Founders Online"
            url: "https://founders.archives.gov/"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 6"
      - title: "Secures Dutch Loans"
        date: "1782-06-11"
        description: "Adams negotiates the first of several crucial loans from Amsterdam bankers"
        body: |
          Alongside recognition, Adams negotiated the first of a series of loans from Amsterdam
          banking houses in the summer of 1782. These funds were a lifeline for the effectively
          bankrupt United States, financing the final stage of the war and the early operations of
          the government. Adams considered the achievement — recognition, loans, and a treaty of
          commerce — the hardest-won and most valuable service of his diplomatic career.
        links:
          - title: "Founders Online — National Archives"
            url: "https://founders.archives.gov/"
