        description: "Adams is sworn as an attorney and begins practice in Braintree and Boston"
        body: |
          In November 1758, after reading law under James Putnam and being examined by the
          leading attorneys of Boston, Adams was admitted to practice. He built his practice
          slowly, riding the circuit courts of Massachusetts and gradually earning a reputation
          for painstaking preparation and legal learning rather than courtroom flash. Within a
          decade he would be among the most respected lawyers in the colony.
