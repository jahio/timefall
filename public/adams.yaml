      - title: "First Continental Congress Convenes"
        date: "1774-09-05"
        description: "Adams joins the Massachusetts delegation in Philadelphia"
        body: |
          The First Continental Congress opened in Philadelphia on September 5, 1774, in response
          to Britain's Coercive (Intolerable) Acts, which had closed the port of Boston. Adams
          arrived a relative unknown among the colonies' leading men, took careful measure of
          them in his diary, and helped push Congress toward a coordinated boycott of British
          goods. He returned home convinced that far more than boycotts would be required.
        links:
          - title: "First Continental Congress"
            url: "https://history.house.gov/Institution/Origins-Development/Continental-Congress/"
        citations:
