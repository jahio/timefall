      - title: "Enters Harvard College"
        date: "1751-01-01"
        time: # exact matriculation day not recorded; year is certain
        description: "Adams begins his studies at Harvard at about age fifteen"
        body: |
          Adams entered Harvard College around 1751, at roughly fifteen years of age. There he
          discovered a love of books and, crucially, of argument. Though his family assumed he
          would become a Congregational minister, Adams found himself drawn instead to
          rhetoric, mathematics, and the study of human character. By graduation he had resolved
          that the ministry's doctrinal quarrels were not for him.
