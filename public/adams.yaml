            publication_date: 1992
            source_location:

  - title: "The Massachusetts Constitution"
    description: "Adams drafts the oldest functioning written constitution in the world, 1779–1780"
    body: |
      Between his two European missions, Adams performed one of the most enduring works of his
      life: he was the principal author of the Massachusetts Constitution of 1780. Its structure —
      a separation of powers among executive, legislature, and judiciary, and a declaration of
      rights — influenced the framing of the United States Constitution seven years later. It
      remains the oldest written constitution still in effect anywhere in the world.
    links:
      - title: "Massachusetts Constitution — Commonwealth of Massachusetts"
        url: "https://malegislature.gov/laws/constitution"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: Simon & Schuster
        publication_date: 2001
        source_location: "Chapter 5"
    actions:
      - title: "Drafts the Massachusetts Constitution"
        date: "1779-09-01"
        description: "As the delegated draftsman, Adams writes the frame of government and a declaration of rights"
        body: |
          Chosen by the Massachusetts constitutional convention as its drafting committee's
          effective author, Adams spent the autumn of 1779 writing a frame of government built on
          the separation of powers and anchored by a declaration of rights. Ratified in 1780, the
          document embodied his conviction that liberty required carefully balanced institutions,
          not merely good intentions. He regarded it as one of his proudest achievements.
        links:
          - title: "The Massachusetts Constitution of 1780 — MHS"
            url: "https://www.masshist.org/"
        citations:
          - author: John Ferling
            source_title: "John Adams: A Life"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Oxford University Press
