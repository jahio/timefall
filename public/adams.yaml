  - title: "Declaring Independence"
    description: "Adams as the 'Atlas of Independence,' 1776"
    body: |
      Thomas Jefferson later called Adams "the Colossus" of the debate for independence — the man
      who, more than any other, argued the wavering Congress into the final leap. Adams served on
      the committee that produced the Declaration, deferring the drafting to the younger Jefferson
      but leading the fight for its adoption on the floor. He also drove the practical work of
      making a nation: sitting on the Board of War, drafting model treaty guidelines, and thinking
      hard about what republican government should look like.
    links:
      - title: "Declaration of Independence — National Archives"
        url: "https://www.archives.gov/founding-docs/declaration"
    citations:
