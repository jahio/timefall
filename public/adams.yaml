        date: "1755-07-16"
        time: # commencement season; precise date approximate
        description: "Adams takes his A.B. degree and turns to schoolteaching and, soon, the law"
        body: |
          Adams graduated from Harvard in 1755. To support himself while he decided on a
          profession, he took a post teaching Latin school in Worcester, a job he found
          tedious. There, boarding with the lawyer James Putnam, he began reading law in the
          evenings and concluded that it — not the ministry — was his path. He worried
          constantly about idleness and ambition, filling his diary with vows of self-discipline
          that he rarely kept.
