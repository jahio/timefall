            source_location: "Chapter 3"
      - title: "Second Continental Congress Convenes"
        date: "1775-05-10"
        description: "With war already begun at Lexington and Concord, Congress reconvenes"
        body: |
          The Second Continental Congress met on May 10, 1775, three weeks after the fighting at
          Lexington and Concord. The delegates now faced the reality of an army in the field
          outside Boston and no clear authority commanding it. Adams argued forcefully that
          Congress must adopt the New England militia as a genuinely Continental Army — and that
          it must be led by a man who could unite all thirteen colonies.
        links:
          - title: "Second Continental Congress — National Archives"
            url: "https://www.archives.gov/"
        citations:
          - author: David McCullough
