      - title: "Marries Abigail Smith"
        date: "1764-10-25"
        description: "John Adams weds Abigail Smith of Weymouth"
        body: |
          On October 25, 1764, John Adams married Abigail Smith, daughter of a Weymouth
          minister. He was twenty-eight; she was nineteen. It was a love match and an
          intellectual one. Over the years Abigail managed the family farm, finances, and
          children through long stretches when John was in Philadelphia or across the Atlantic,
          becoming in effect his most trusted political adviser as well as his wife.
        links:
