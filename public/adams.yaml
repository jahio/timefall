      - title: "John Adams is Born in Braintree"
        date: "1735-10-30"
        description: "Born on the family farm in Braintree (present-day Quincy), Massachusetts"
        body: |
          John Adams was born on October 30, 1735, in a saltbox farmhouse in the north precinct
          of Braintree, the parish that would later be set off as the town of Quincy. He was the
          eldest of three sons of John Adams Sr. and Susanna Boylston Adams. By his own account
          he was a restless, self-doubting boy, more interested in hunting and sailing toy boats
          than in Latin grammar, until his father made plain that education was the price of any
          future beyond the plough.
