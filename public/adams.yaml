      - title: "Adams Nominates Washington as Commander in Chief"
        date: "1775-06-14"
        description: "Adams rises in Congress to nominate George Washington to command the army"
        body: |
          On June 14, 1775, Adams rose in Congress and, in a carefully calculated move, nominated
          George Washington of Virginia to command the newly created Continental Army. Choosing a
          Virginian to lead a war that had so far been fought by New Englanders was a masterstroke
          of continental unity. Washington, seated in the room in his blue militia uniform,
          withdrew in modesty; Congress confirmed the appointment the next day, June 15. It was
          arguably the single most consequential decision Adams ever helped bring about.
        links:
          - title: "Washington Takes Command — Mount Vernon"
            url: "https://www.mountvernon.org/george-washington/the-revolutionary-war/"
        citations:
          - author: David McCullough
