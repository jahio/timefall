  - title: "Peace and the Court of St. James's"
    description: "The Treaty of Paris and Adams as first American minister to Britain, 1783–1788"
    body: |
      Adams rejoined Franklin and John Jay in Paris to negotiate the peace that ended the
      Revolutionary War, insisting successfully on generous boundaries and American fishing
      rights off Newfoundland. With independence won, Congress sent him to London as the first
      United States minister to the very Court he had helped rebel against — an assignment of
      exquisite awkwardness that he handled with dignity, if without warmth from his hosts.
    links:
      - title: "Treaty of Paris (1783) — National Archives"
        url: "https://www.archives.gov/milestone-documents/treaty-of-paris"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: Simon & Schuster
        publication_date: 2001
        source_location: "Chapters 6–7"
    actions:
      - title: "The Treaty of Paris is Signed"
        date: "1783-09-03"
        description: "Adams, Franklin, and Jay conclude the treaty ending the Revolutionary War"
        body: |
          On September 3, 1783, the American commissioners — Adams, Franklin, and John Jay —
          signed the Treaty of Paris with Great Britain, formally ending the Revolutionary War and
          recognizing the independence of the United States. Adams had fought hard for favorable
          terms, especially the fishing rights vital to New England's economy. The old friction
          with Franklin persisted, but the three men had together secured a remarkably good peace.
        links:
          - title: "Treaty of Paris — National Archives"
            url: "https://www.archives.gov/milestone-documents/treaty-of-paris"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 6"
      - title: "Presented to King George III"
        date: "1785-06-01"
        description: "Adams becomes the first U.S. minister to Great Britain"
        body: |
          On June 1, 1785, Adams was presented to King George III as the first minister of the
          United States to the Court of St. James's — the American rebel now formally received by
          the monarch he had defied. The meeting was courteous and, by both accounts, genuinely
          moving. But Adams found his mission largely fruitless: Britain was in no hurry to make
          commercial concessions to its former colonies, and he grew frustrated and homesick.
        links:
          - title: "John Adams as Minister to Britain — Founders Online"
            url: "https://founders.archives.gov/"
        citations:
          - author: David McCullough
