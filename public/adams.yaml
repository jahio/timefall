    actions:
      - title: "Friendship with Dr. Joseph Warren"
        date: "1772-01-01"
        time: # the friendship deepened over years; a representative date
        description: "Adams befriends Joseph Warren, a leader of the Boston resistance"
        body: |
          Through the early 1770s Adams became closely associated with Dr. Joseph Warren, the
          young Boston physician who was fast becoming one of the most dynamic leaders of the
          patriot cause. Warren drafted the Suffolk Resolves, organized resistance, and
          eventually accepted a commission as a major general. To Adams and to many others,
          Warren embodied the selfless ardor the Revolution demanded — which is precisely why his
          death would strike so hard.
        links:
