  - title: "Diplomacy in France and the Rift with Franklin"
    description: "Adams sails for Europe and clashes with Benjamin Franklin, 1777–1779"
    body: |
      In 1777 Congress sent Adams to France to join the commission negotiating the vital alliance
      and to help manage American affairs abroad. He arrived to find the alliance essentially
      already secured and the commission a tangle of jealousies. Adams's blunt, industrious,
      moralistic style grated against the worldly, popular, famously easygoing Benjamin Franklin,
      whose salon celebrity Adams distrusted. Congress ultimately resolved the friction by
      dissolving the joint commission and naming Franklin sole minister to France — leaving Adams,
      for a time, without a clear post.
    links:
      - title: "American Commissioners in France — Founders Online"
        url: "https://founders.archives.gov/"
    citations:
