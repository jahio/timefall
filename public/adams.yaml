      - title: "Rex v. Wemms — Trial of the Soldiers"
        date: "1770-11-27"
        description: "The enlisted men are tried; six acquitted, two convicted of manslaughter"
        body: |
          The trial of the eight enlisted soldiers began in late November 1770. Here Adams made
          his most famous argument, warning the jury that "facts are stubborn things" and that
          passions and wishes could not alter the evidence. He contended the men had acted in
          self-defense against a threatening mob. In early December the jury acquitted six of the
          soldiers; two — Hugh Montgomery and Matthew Kilroy — were convicted of the lesser charge
          of manslaughter and, pleading benefit of clergy, were branded on the thumb rather than
          hanged. Adams had secured, in the teeth of public opinion, something close to justice.
        links:
          - title: "Rex v. Wemms — Famous Trials"
            url: "https://famous-trials.com/bostonmassacre/219-soldiers"
