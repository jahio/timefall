      - title: "Sails for France Aboard the Frigate Boston"
        date: "1778-02-13"
        description: "Adams and ten-year-old John Quincy cross a stormy, dangerous Atlantic"
        body: |
          On February 13, 1778, Adams embarked on the frigate Boston with his ten-year-old son
          John Quincy. The voyage was harrowing — winter gales, a pursuing British warship, and a
          lightning strike that killed a crewman. Adams reached France in the spring to discover
          that Franklin had already concluded the Treaty of Alliance, and that his own role was
          far murkier than he had expected.
        links:
          - title: "John Adams's Diary — Massachusetts Historical Society"
            url: "https://www.masshist.org/digitaladams/"
