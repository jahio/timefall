            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 4"
      - title: "Joint Commission Dissolved; Franklin Named Sole Minister"
        date: "1778-09-14"
        description: "Congress ends the unwieldy commission, sidelining Adams in France"
        body: |
          In September 1778 Congress resolved the dysfunction of the three-man commission by
          naming Franklin sole minister plenipotentiary to France. Word reached Europe in early
          1779. Adams, left without instructions or office and resentful of what he saw as
          Franklin's indolence and vanity, decided there was nothing to do but return home. The
          episode planted a lasting mutual distrust between the two men, though Adams never denied
          Franklin's genius.
        links:
          - title: "Founders Online — National Archives"
            url: "https://founders.archives.gov/"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 5"
      - title: "Returns Home to Massachusetts"
        date: "1779-08-02"
        description: "Adams arrives back in Braintree, briefly, before a new mission"
        body: |
          Adams landed back in Massachusetts in the summer of 1779, expecting to resume his law
          practice and his farm. His homecoming was brief. Within months his state and Congress
          would call on him again — first to help write the Massachusetts Constitution, and then
          to return to Europe on an even more important errand.
        links:
          - title: "Adams Papers — Massachusetts Historical Society"
            url: "https://www.masshist.org/adams"
