  - title: "Birth and Education"
    description: "The making of a New England lawyer, 1735–1758"
    body: |
      John Adams was born into the third generation of a modest but respected Massachusetts
      farming family. His father, John Adams Sr., was a farmer, a cordwainer (shoemaker), a
      deacon, and a town selectman who expected his eldest son to enter the ministry. The boy
      preferred the fields and the outdoors, but a series of demanding schoolmasters and his own
      late-blooming ambition carried him to Harvard and then, against his father's hopes, into
      the law rather than the pulpit.
