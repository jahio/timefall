      - title: "The Boston Massacre"
        date: "1770-03-05"
        time: "21:00:00 EST" # evening; time approximate, adjusted to modern zone
        description: "British troops fire on a Boston crowd, killing five; the propaganda war begins"
        body: |
          On the evening of March 5, 1770, a jeering crowd harassed a lone British sentry outside
          the Custom House on King Street. A relief squad under Captain Thomas Preston came to his
          aid, and in the confusion of shouting, snowballs, and clubs, the soldiers fired.
          Five colonists died, among them Crispus Attucks. Paul Revere's engraving quickly turned
          the chaotic street brawl into a symbol of British tyranny. Into this superheated
          atmosphere stepped John Adams, agreeing to defend the accused.
        links:
