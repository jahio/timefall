title: "John Adams: (1735-1826) (AI-Generated, Fact Check)"
intro: |
  John Adams (1735–1826) was a farmer's son from Braintree, Massachusetts, who became a
  lawyer, a revolutionary, a diplomat, the first Vice President of the United States, and its
  second President. He was, by his own admission, "obnoxious, suspected, and unpopular" — vain,
  thin-skinned, and incapable of the easy charm of a Franklin or a Washington — and yet almost
  no one did more to argue the American colonies into independence or to secure the young
  republic's survival in its most dangerous decade.

  This timeline traces his whole arc: the defense of British soldiers he believed entitled to a
  fair trial; the friendships and losses that shaped him, from Joseph Warren's martyrdom at
  Bunker Hill to the death of his beloved Abigail; his diplomacy in France and the Dutch
  Republic; his bruising vice presidency under Washington and his single, embattled term as
  President; the Alien and Sedition Acts that stained his record and the peace with France he
  counted his proudest act; his long estrangement from Thomas Jefferson and their extraordinary
  reconciliation; and the son, John Quincy Adams, who followed him into the presidency. It ends
  where Adams's story became legend: on July 4, 1826, the fiftieth anniversary of the
  Declaration of Independence, when he and Jefferson died within hours of each other.

  The dates below use the modern (New Style) calendar. Where an exact day or hour is uncertain,
  it is noted as an approximation.
