  - title: "Vice Presidency under Washington"
    description: "Eight years in the 'most insignificant office,' 1789–1797"
    body: |
      In the first federal elections, Adams finished second to Washington in the electoral
      college and thus became the first Vice President of the United States. He presided over the
      Senate, cast a record number of tie-breaking votes, and generally supported the
      administration's Federalist program — but he found the office maddeningly powerless,
      calling it, in a much-quoted letter to Abigail, the most insignificant office ever
      contrived. He served two full terms alongside Washington.
    links:
      - title: "John Adams, Vice President — U.S. Senate"
        url: "https://www.senate.gov/about/officers-staff/vice-president/VP_John_Adams.htm"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: Simon & Schuster
        publication_date: 2001
        source_location: "Chapter 8"
    actions:
      - title: "Inaugurated as First Vice President"
        date: "1789-04-21"
        description: "Adams takes office as Vice President under President Washington"
        body: |
          Adams took up the vice presidency on April 21, 1789, days before Washington's own
          inauguration. As presiding officer of the Senate he threw himself into the work,
          including a famously prickly debate over what titles to give the President that earned
          him ridicule and the nickname "His Rotundity." He cast numerous tie-breaking votes —
          more than any Vice President for well over a century — but chafed at his exclusion from
          real executive power.
        links:
          - title: "President of the Senate — U.S. Senate"
            url: "https://www.senate.gov/about/officers-staff/vice-president/vice-president.htm"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 8"
      - title: "Re-elected Vice President"
        date: "1792-12-05"
        description: "Adams wins a second term as Washington's deputy"
        body: |
          Adams was re-elected Vice President in 1792, serving a second term as party divisions
          hardened into the first American political parties — Federalists behind Hamilton and
          Adams, Democratic-Republicans behind Jefferson and Madison. The rivalry with his old
          friend Jefferson, once philosophical and warm, began to acquire a partisan edge that
          would eventually rupture their friendship altogether.
        links:
          - title: "The First Party System — Miller Center"
            url: "https://millercenter.org/president/washington"
        citations:
          - author: Joseph J. Ellis
            source_title: "Founding Brothers: The Revolutionary Generation"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Alfred A. Knopf
            publication_date: 2000
            source_location:

  - title: "The Presidency"
    description: "One embattled term: the XYZ Affair, the Navy, the Alien and Sedition Acts, and peace with France, 1797–1801"
    body: |
      Adams was elected the second President of the United States in 1796, narrowly defeating
      Jefferson, who under the rules of the time became Vice President. His single term was
      dominated by the undeclared naval Quasi-War with France, provoked by French attacks on
      American shipping and inflamed by the XYZ Affair. Adams rebuilt the navy and prepared for
      war — but ultimately, at great political cost to himself, chose to make peace. The same
      years produced the Alien and Sedition Acts, the darkest stain on his record, and the
      removal of the seat of government to the unfinished new capital on the Potomac.
    links:
      - title: "John Adams as President — Miller Center"
        url: "https://millercenter.org/president/adams"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: Simon & Schuster
        publication_date: 2001
        source_location: "Chapters 9–10"
    actions:
      - title: "Inaugurated as Second President"
        date: "1797-03-04"
        description: "Adams succeeds Washington in the first peaceful transfer of presidential power"
        body: |
          Adams was inaugurated on March 4, 1797, succeeding Washington in what was the young
          republic's first transfer of the presidency. He inherited Washington's cabinet — a
          decision he came to regret, as several members were more loyal to Alexander Hamilton
          than to their new chief. Relations with Revolutionary France were deteriorating fast,
          and the crisis would consume his term.
        links:
          - title: "Adams's Inauguration — Miller Center"
            url: "https://millercenter.org/president/adams"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 9"
      - title: "The XYZ Affair"
        date: "1798-04-03"
        description: "French demands for bribes, revealed to Congress, ignite anti-French fury"
        body: |
          Adams sent commissioners to Paris to ease tensions, but French agents — later identified
          in published dispatches only as X, Y, and Z — demanded bribes and a loan before
          negotiations could even begin. When Adams released the dispatches to Congress in the
          spring of 1798, the insult produced a wave of national outrage, captured in the popular
          slogan "millions for defense, but not one cent for tribute." Public feeling swung
          sharply behind the previously unpopular Adams — and toward war.
        links:
          - title: "The XYZ Affair — Office of the Historian, U.S. State Department"
            url: "https://history.state.gov/milestones/1784-1800/xyz"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 9"
      - title: "Birth of the U.S. Navy: The Department of the Navy is Established"
        date: "1798-04-30"
        description: "Amid attacks on American ships and seamen, Congress creates a permanent naval establishment"
        body: |
          The Continental Navy had been disbanded after the Revolution, leaving American merchant
          ships defenseless. As French privateers seized hundreds of American vessels and the
          rights of American sailors were trampled — impressment and the seizure of neutral crews
          being the era's great maritime grievances — Congress and Adams moved to rebuild sea
          power. On April 30, 1798, Congress established a separate Department of the Navy, and
          the frigates authorized under the earlier Naval Act (including the USS Constitution) put
          to sea. Adams's determination to build and use this force during the Quasi-War earned
          him lasting recognition as a father of the modern United States Navy.
        links:
          - title: "Establishment of the Department of the Navy — Naval History and Heritage Command"
            url: "https://www.history.navy.mil/"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 9"
      - title: "The Alien and Sedition Acts"
        date: "1798-07-14"
        description: "Adams signs laws curbing immigrants and criminalizing criticism of the government"
        body: |
          In the summer of 1798, with war fever high, the Federalist Congress passed and Adams
          signed four laws known collectively as the Alien and Sedition Acts. They lengthened the
          residency required for citizenship, empowered the President to deport or detain
          non-citizens, and — most notoriously — made it a crime to publish "false, scandalous,
          and malicious" writing against the government. The Sedition Act was used to prosecute
          Republican newspaper editors, and it provoked the Virginia and Kentucky Resolutions in
          protest. Though Adams never pushed for the laws and let much of them lapse, signing them
          remains the gravest blemish on his presidency.
        links:
          - title: "Alien and Sedition Acts — National Archives"
            url: "https://www.archives.gov/milestone-documents/alien-and-sedition-acts"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 9"
      - title: "Peace with France: The Convention of 1800"
        date: "1800-09-30"
        description: "Adams ends the Quasi-War, splitting his own party but averting a full war"
        body: |
          Against the wishes of the Hamiltonian wing of his own Federalist party, which wanted a
          declared war, Adams sent a new peace mission to France. The result was the Convention of
          1800 (the Treaty of Mortefontaine), signed on September 30, 1800, which ended the
          Quasi-War and dissolved the entangling 1778 alliance. The decision shattered Federalist
          unity and helped cost Adams re-election, but he regarded it as the finest and most
          selfless act of his public life — the achievement he wanted remembered on his
          gravestone: peace with France in the year 1800.
        links:
          - title: "Convention of 1800 — Office of the Historian, U.S. State Department"
            url: "https://history.state.gov/milestones/1784-1800/xyz"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 10"
      - title: "Adams Moves into the Unfinished President's House"
        date: "1800-11-01"
        description: "Adams becomes the first President to live in the new capital on the Potomac"
        body: |
          On November 1, 1800, Adams became the first President to occupy the still-unfinished
          President's House (the White House) in the raw new capital city of Washington. The
          building was cold and damp, its plaster still wet, the surrounding city little more than
          mud and stumps. In a letter to Abigail, Adams offered a blessing on the house — that
          none but honest and wise men might ever rule beneath its roof — words later carved into
          the mantel of the State Dining Room by Franklin Roosevelt.
        links:
          - title: "Adams Moves to Washington — White House Historical Association"
            url: "https://www.whitehousehistory.org/"
        citations:
          - author: David McCullough
            source_title: "John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Simon & Schuster
            publication_date: 2001
            source_location: "Chapter 10"
      - title: "Defeat in the Election of 1800"
        date: "1801-03-04"
        description: "Adams loses to Jefferson and quietly leaves Washington before the inauguration"
        body: |
          The bitter election of 1800 sent Adams down to defeat at the hands of Thomas Jefferson,
          his old friend and now his political enemy. Wounded by the loss and grieving the recent
          death of his son Charles, Adams left Washington in the early morning hours before
          Jefferson's inauguration on March 4, 1801, rather than attend it. In his final days in
          office he made a series of "midnight" judicial appointments — one of which produced the
          landmark case Marbury v. Madison — and then retired for good to his farm in Quincy.
        links:
          - title: "The Election of 1800 — Miller Center"
            url: "https://millercenter.org/president/adams/campaigns-and-elections"
        citations:
          - author: Joseph J. Ellis
            source_title: "Founding Brothers: The Revolutionary Generation"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Alfred A. Knopf
            publication_date: 2000
            source_location:

  - title: "Retirement, Estrangement, and Reconciliation"
    description: "The farm at Quincy, the broken friendship with Jefferson, and its healing, 1801–1818"
    body: |
      Out of office at sixty-five, Adams returned to his farm, which he called Peacefield, and to
      Abigail. He read voraciously, wrote a sprawling autobiography, tended his fields, and
      brooded over his reputation. For years he and Jefferson did not speak, their friendship a
      casualty of the party wars. Then, through the patient mediation of their mutual friend
      Benjamin Rush, the two old revolutionaries resumed a correspondence that became one of the
      treasures of American letters — a decade-long exchange on politics, philosophy, religion,
      aging, and the meaning of the Revolution they had made together.
    links:
      - title: "The Adams-Jefferson Letters — Founders Online"
        url: "https://founders.archives.gov/"
    citations:
      - author: Joseph J. Ellis
        source_title: "Passionate Sage: The Character and Legacy of John Adams"
        source_type: Book
        source_version:
        source_number:
        contributors:
        publisher: W. W. Norton
        publication_date: 1993
        source_location:
    actions:
      - title: "Retires to Peacefield in Quincy"
        date: "1801-03-18"
        description: "Adams settles into farming, reading, and writing in retirement"
        body: |
          Adams reached his Quincy farm in March 1801 and, apart from his correspondence, largely
          withdrew from public life. He threw himself into agriculture, family, and reflection,
          and eventually into a long, digressive defense of his career and views. The years of
          quiet reading and writing softened, though never entirely dissolved, his lifelong
          sensitivity to slights and his hunger for recognition.
        links:
          - title: "Peacefield — Adams National Historical Park (NPS)"
            url: "https://www.nps.gov/adam/index.htm"
        citations:
          - author: Joseph J. Ellis
            source_title: "Passionate Sage: The Character and Legacy of John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: W. W. Norton
            publication_date: 1993
            source_location:
      - title: "Reconciliation with Jefferson Begins"
        date: "1812-01-01"
        description: "Adams writes to Jefferson, reopening a friendship broken for a decade"
        body: |
          On New Year's Day 1812, prompted by the persistent Benjamin Rush, Adams sent Thomas
          Jefferson a brief, friendly note — famously mentioning "two pieces of homespun" he was
          sending along (in fact a two-volume set of lectures). Jefferson replied warmly, and the
          floodgates opened. Over the next fourteen years the two men exchanged more than 150
          letters, ranging across every subject that had ever engaged them, and repairing one of
          the most important friendships in American history.
        links:
          - title: "Adams to Jefferson, January 1, 1812 — Founders Online"
            url: "https://founders.archives.gov/"
        citations:
          - author: Joseph J. Ellis
            source_title: "Founding Brothers: The Revolutionary Generation"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Alfred A. Knopf
            publication_date: 2000
            source_location:
      - title: "Death of Abigail Adams"
        date: "1818-10-28"
        description: "Adams loses his wife and partner of fifty-four years to typhoid fever"
        body: |
          On October 28, 1818, Abigail Adams died of typhoid fever after fifty-four years of
          marriage. Her loss was the deepest sorrow of John's long life. Jefferson, learning of
          it, wrote his old friend a letter of consolation that moved Adams profoundly and drew
          the two men closer still. Abigail's letters would later secure her own place as one of
          the most compelling voices of the founding era.
        links:
          - title: "Abigail Adams — Massachusetts Historical Society"
            url: "https://www.masshist.org/adams"
        citations:
          - author: Joseph J. Ellis
            source_title: "First Family: Abigail and John Adams"
            source_type: Book
            source_version:
            source_number:
            contributors:
            publisher: Alfred A. Knopf
            publication_date: 2010
            source_location:

  - title: "Final Years and Death"
    description: "A son in the White House and the famous coincidence of the Fourth of July, 1825–1826"
    body: |
      Adams lived long enough to see his son John Quincy Adams elected President — a satisfaction
      granted to no other founder. And then, in an ending that seemed almost scripted by
      providence, he died on July 4, 1826, the fiftieth anniversary of the Declaration of
      Independence, within hours of Thomas Jefferson. The coincidence stunned the nation and
      sealed both men's places in American mythology.
    links:
      - title: "John Adams — Miller Center"
        url: "https://millercenter.org/president/adams/death-of-the-president"
    citations:
      - author: David McCullough
        source_title: "John Adams"
        source_type: Book
